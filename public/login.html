<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Study Room Booking - Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top left, #4f46e5, #111827);
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
    }

    .card {
      background: #f9fafb;
      border-radius: 14px;
      padding: 28px 26px 26px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(15, 23, 42, 0.12);
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #6b7280;
      text-align: center;
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 11px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      background-color: #f3f4f6;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 1px rgba(79, 70, 229, 0.3);
      background-color: #ffffff;
    }

    .field {
      margin-bottom: 14px;
    }

    button[type="submit"] {
      width: 100%;
      padding: 10px;
      border-radius: 999px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      color: #f9fafb;
      background: linear-gradient(to right, #4f46e5, #6366f1);
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.45);
      transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.1s ease;
    }

    button[type="submit"]:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(79, 70, 229, 0.55);
      opacity: 0.98;
    }

    button[type="submit"]:active {
      transform: translateY(0);
      box-shadow: 0 8px 18px rgba(79, 70, 229, 0.4);
      opacity: 0.95;
    }

    #message {
      margin-top: 10px;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
    }

    #message.error {
      color: #b91c1c;
    }

    #message.success {
      color: #065f46;
    }

    .hint {
      margin-top: 16px;
      font-size: 11px;
      color: #9ca3af;
      text-align: center;
      line-height: 1.4;
    }

    .hint span {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="title">Campus Study Room Booking</div>
      <div class="subtitle">Sign in with your campus account</div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" name="email" placeholder="student1@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" name="password" placeholder="Password" required>
        </div>
        <button type="submit">Sign in</button>
      </form>

      <p id="message"></p>

      <div class="hint">
        <span>Sample student account: student1@example.com / password</span>
        <span>Sample admin account: admin@example.com / adminpass</span>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const messageEl = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      messageEl.textContent = "";
      messageEl.className = "";

      const formData = new FormData(form);
      const payload = Object.fromEntries(formData.entries());

      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if (res.ok) {
        messageEl.textContent = "Login successful. Redirecting...";
        messageEl.className = "success";

        const isAdmin = data.user && data.user.isAdmin;

        if (isAdmin) {
          window.location.href = "/admin.html";
        } else {
          window.location.href = "/search.html";
        }
      } else {
        messageEl.textContent = data.message || "Login failed";
        messageEl.className = "error";
      }
    });
  </script>
</body>
</html>
